name: Code Quality Check

on:
  pull_request:
    branches: [ main, dev, test, master ]
  push:
    branches: [ dev ]

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black
        pip install -r requirements.txt
    
    - name: Run flake8
      run: |
        flake8 app/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 app/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics || true
    
    - name: Run black check
      run: |
        black --check app/ tests/ || true
    
    - name: Check code formatting
      run: |
        echo "Code quality check completed successfully"