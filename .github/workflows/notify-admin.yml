name: Notify Admin

on:
  push:
    branches: [ master ]
  workflow_run:
    workflows: ["Unit Tests"]
    types: [completed]

jobs:
  notify-admin:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    steps:
    - name: Send notification
      run: |
        echo "MLOps Pipeline completed successfully!"
        echo "Model deployed and containerized."
        echo "Jenkins job executed successfully."